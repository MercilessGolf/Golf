```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Golf Drill Library</title>

<style>

body{
font-family:system-ui,Arial;
background:#eef2f7;
margin:0;
padding:20px;
color:#222;
}

h1{
text-align:center;
margin-bottom:10px;
}

.nav{
text-align:center;
margin-bottom:20px;
}

.nav a{
background:#2c7be5;
color:white;
padding:10px 18px;
margin:4px;
border-radius:6px;
text-decoration:none;
font-weight:600;
}

.controls{
text-align:center;
margin-bottom:20px;
}

.search{
padding:10px;
font-size:15px;
width:260px;
border-radius:6px;
border:1px solid #ccc;
}

button{
padding:10px 14px;
border:none;
border-radius:6px;
margin-left:6px;
font-weight:600;
cursor:pointer;
}

.random{background:#27ae60;color:white;}
.practice{background:#e67e22;color:white;}
.favbtn{background:#444;color:white;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-top:10px;
}

.card{
background:white;
padding:10px;
border-radius:12px;
box-shadow:0 6px 14px rgba(0,0,0,.12);
text-align:center;
position:relative;
transition:.2s;
}

.card:hover{
transform:translateY(-4px);
}

.card img{
width:200px;
height:350px;
object-fit:cover;
border-radius:10px;
cursor:pointer;
}

.label{
margin-top:8px;
font-weight:600;
font-size:14px;
}

.tag{
display:inline-block;
background:#eef2f7;
padding:3px 8px;
font-size:11px;
border-radius:4px;
margin-top:4px;
}

.star{
position:absolute;
top:8px;
right:10px;
font-size:22px;
cursor:pointer;
color:#ccc;
}

.star.active{
color:gold;
}

.session{
margin-top:30px;
padding:15px;
background:white;
border-radius:10px;
box-shadow:0 6px 14px rgba(0,0,0,.12);
}

.session h2{
margin-top:0;
}

.session-list{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.session-item{
background:#eef2f7;
padding:6px 10px;
border-radius:6px;
font-size:14px;
}

</style>
</head>

<body>

<h1>Golf Drill Library</h1>

<div class="nav">
<a href="index.html">Drills</a>
<a href="office.html">Office</a>
<a href="stretching.html">Stretching</a>
</div>

<div class="controls">

<input id="search" class="search" placeholder="Search drills...">

<button class="random" onclick="randomDrill()">Random</button>
<button class="practice" onclick="practiceSession()">Practice 5</button>
<button class="favbtn" onclick="showFavorites()">Favorites</button>

</div>

<div id="grid" class="grid"></div>

<div id="session" class="session" style="display:none;">
<h2>Practice Session</h2>
<div id="sessionList" class="session-list"></div>
</div>

<script>

const drills=[

{img:"GripDrill",label:"Grip Test",url:"https://youtube.com/shorts/FXCRiwjWSws",cat:"setup"},
{img:"HeadStill",label:"Keep Head Still",url:"https://www.facebook.com/share/r/1H16ixiqbd/",cat:"setup"},
{img:"WeightShift",label:"Weight Shift",url:"https://www.facebook.com/share/r/1BWfWbr27A/",cat:"pivot"},
{img:"SlowDown",label:"Slow Down Swing",url:"https://youtube.com/shorts/o72qLYgj8ug",cat:"tempo"},
{img:"SquashBug",label:"Squash The Bug",url:"https://www.facebook.com/reel/1878055812806888",cat:"pivot"},
{img:"OneHandSwing",label:"One Hand Swing",url:"https://youtube.com/shorts/ircfhXoBUrg",cat:"arms"},
{img:"GeneratePower",label:"Generate Power",url:"https://youtube.com/shorts/lKmhCgld1W0",cat:"power"},
{img:"DropArms",label:"Drop Arms",url:"https://www.facebook.com/share/r/16JUHTPiGX/",cat:"transition"},
{img:"LtoLDrill",label:"L to L Drill",url:"https://www.facebook.com/share/r/19xXuvJdbT/",cat:"release"},
{img:"SequencingDrill",label:"Sequencing",url:"https://www.facebook.com/share/r/1ACeph1XQ4/",cat:"sequence"}

];

const grid=document.getElementById("grid");

let favorites=JSON.parse(localStorage.getItem("favDrills")||"[]");

function draw(list){

grid.innerHTML="";

list.forEach(d=>{

const card=document.createElement("div");
card.className="card";

const star=document.createElement("div");
star.className="star";
star.innerHTML="★";

if(favorites.includes(d.img)) star.classList.add("active");

star.onclick=()=>toggleFav(d.img,star);

card.innerHTML+=`
<a href="${d.url}" target="_blank">
<img src="${d.img}.png">
</a>
<div class="label">${d.label}</div>
<div class="tag">${d.cat}</div>
`;

card.appendChild(star);

grid.appendChild(card);

});

}

function toggleFav(name,star){

if(favorites.includes(name)){
favorites=favorites.filter(f=>f!==name);
star.classList.remove("active");
}else{
favorites.push(name);
star.classList.add("active");
}

localStorage.setItem("favDrills",JSON.stringify(favorites));

}

document.getElementById("search").addEventListener("input",function(){

const t=this.value.toLowerCase();

const filtered=drills.filter(d=>d.label.toLowerCase().includes(t));

draw(filtered);

});

function randomDrill(){

const r=drills[Math.floor(Math.random()*drills.length)];

alert("Random Drill:\n\n"+r.label);

}

function practiceSession(){

const shuffled=[...drills].sort(()=>.5-Math.random()).slice(0,5);

const list=document.getElementById("sessionList");

list.innerHTML="";

shuffled.forEach(d=>{

const item=document.createElement("div");
item.className="session-item";
item.textContent=d.label;

list.appendChild(item);

});

document.getElementById("session").style.display="block";

}

function showFavorites(){

const fav=drills.filter(d=>favorites.includes(d.img));

draw(fav);

}

draw(drills);

</script>

</body>
</html>
```
