<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Drill Library</title>

<style>

body{
font-family:Arial, sans-serif;
background:#f4f4f4;
margin:0;
padding:20px;
}

.navbar{
text-align:center;
margin-bottom:25px;
}

.navbtn{
display:inline-block;
padding:10px 20px;
margin:5px;
background:#2c7be5;
color:white;
text-decoration:none;
border-radius:6px;
font-weight:bold;
}

.navbtn:hover{
background:#1a5fc2;
}

h1{
text-align:center;
margin-bottom:40px;
}

.section{
margin-bottom:50px;
}

.section-title{
font-size:26px;
border-bottom:3px solid #ddd;
padding-bottom:8px;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.card{
text-align:center;
}

.card img{
width:200px;
height:350px;
object-fit:cover;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.15);
cursor:pointer;
transition:.2s;
}

.card img:hover{
transform:scale(1.03);
}

.label{
margin-top:8px;
font-weight:bold;
font-size:14px;
}

.notes{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 8px rgba(0,0,0,.1);
line-height:1.6;
}

</style>
</head>

<body>

<div class="navbar">
<a class="navbtn" href="office.html">Office</a>
<a class="navbtn" href="stretching.html">Stretching</a>
</div>

<h1>Golf Drill Library</h1>

<div id="library"></div>
