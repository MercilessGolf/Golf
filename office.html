<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Drills</title>

<style>

body{
font-family:Arial, sans-serif;
background:#f4f4f4;
margin:0;
padding:20px;
}

/* NAVIGATION */

.navbar{
text-align:center;
margin-bottom:25px;
}

.navbtn{
display:inline-block;
padding:10px 22px;
margin:6px;
background:#2c7be5;
color:white;
text-decoration:none;
border-radius:6px;
font-weight:bold;
font-size:14px;
}

.navbtn:hover{
background:#1a5fc2;
}

h1{
text-align:center;
margin-bottom:40px;
}

/* SECTIONS */

.section{
margin-bottom:50px;
}

.section-title{
font-size:26px;
border-bottom:3px solid #ddd;
padding-bottom:8px;
margin-bottom:20px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.card{
text-align:center;
}

.card img{
width:200px;
height:350px;
object-fit:cover;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.15);
cursor:pointer;
transition:.2s;
}

.card img:hover{
transform:scale(1.04);
}

.label{
margin-top:8px;
font-weight:bold;
font-size:14px;
}

</style>
</head>

<body>

<div class="navbar">
<a class="navbtn" href="index.html">Drills</a>
<a class="navbtn" href="stretching.html">Stretching</a>
<a class="navbtn" href="office.html">Office</a>
</div>

<h1>Office Drills</h1>

<div id="library"></div>

<script>

const list = `

(LeftKnee) - Left Knee - https://youtube.com/shorts/q17LA-BlIrE
(RotationOffice) - Rotation Drill - https://youtube.com/shorts/9BjYi4fHB9Y
(SwayFix) - Sway Fix - https://www.facebook.com/share/r/1LjfWo8PER/
(ShallowingExercises) - Shallowing - https://www.facebook.com/share/r/1CeA2a6T5y/
(BackswingOffice) - Backswing - https://www.facebook.com/share/r/17Fpxu57XX/
(BackswingPosture) - Backswing - https://www.facebook.com/share/r/179sBZc4U2/
(BackswingWall) - Backswing - https://www.facebook.com/share/r/14DzAbzTQQQ/
(HipMovement) - Hip Movement - https://www.facebook.com/share/r/1DpA9WH1EK/
(PivotDrill) - Pivot Drill - https://www.facebook.com/share/r/1Bs7Hz8B9S/
(HeadOnWall) - Head On Wall - https://www.facebook.com/share/r/19nQ8q3FtQ/
(LeaningDrill) - Leaning Drill - https://www.facebook.com/share/r/1GEe8VFekf/
(RightArmOffice) - Right Arm Drill - https://www.facebook.com/share/r/1BZn76taeq/
(DownswingFeels) - Downswing Feels - https://www.facebook.com/share/r/1a1XxK1S5X/
(SwayDrillOffice) - Sway Drill - https://www.facebook.com/share/r/1DEFXsiXGY/
(CompressionOffice) - Compression Drill - https://www.facebook.com/share/r/1KRRonHu2r/

`;

const container=document.getElementById("library");

const section=document.createElement("div");
section.className="section";

const heading=document.createElement("div");
heading.className="section-title";
heading.textContent="Office Drills";

const grid=document.createElement("div");
grid.className="grid";

section.appendChild(heading);
section.appendChild(grid);
container.appendChild(section);

list.trim().split("\n").forEach(line=>{

const match=line.match(/\((.*?)\)\s-\s(.*?)\s-\s(.*)/);
if(!match) return;

const file=match[1];
const label=match[2];
const url=match[3];

const card=document.createElement("div");
card.className="card";

card.innerHTML=`
<a href="${url}" target="_blank">
<img src="${file}.png">
</a>
<div class="label">${label}</div>
`;

grid.appendChild(card);

});

</script>

</body>
</html>
